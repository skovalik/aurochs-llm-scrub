[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "aurochs-llm-scrub"
version = "0.1.0"
description = "Detect and scrub LLM writing patterns from your prose."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Stefan Kovalik", email = "stefan@aurochs.agency" },
]
maintainers = [
    { name = "Stefan Kovalik", email = "stefan@aurochs.agency" },
]
keywords = [
    "llm",
    "scrub",
    "writing",
    "ai-text-detection",
    "pre-commit",
    "claude",
    "mcp",
    "claude-code-plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Utilities",
]
dependencies = [
    "aurochs-core>=0.1.0,<0.2.0",
    "langdetect>=1.0",
    "mcp>=0.9",
    "platformdirs>=4.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# `redos-detector` ships as an optional ReDoS *static* checker. The
# engine's load-bearing defense is the per-rule wall-clock timeout
# (BLOCKER #4 in plan v4 / scrubber.py); the static check is a
# best-effort second line that the runtime tolerates as missing
# (``_redos_check`` swallows ImportError + returns ``None``). Listed
# here so users who want the static check can opt in via
# ``pip install aurochs-llm-scrub[redos]``.
redos = [
    "redos-detector>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil",
]
all = [
    "aurochs-llm-scrub[redos]",
]

[project.scripts]
"llm-scrub" = "aurochs_llm_scrub.cli.main:main"

[project.urls]
Homepage = "https://github.com/skovalik/aurochs-llm-scrub"
Repository = "https://github.com/skovalik/aurochs-llm-scrub"
Issues = "https://github.com/skovalik/aurochs-llm-scrub/issues"

[tool.hatch.build.targets.wheel]
packages = ["aurochs_llm_scrub"]

[tool.hatch.build.targets.sdist]
include = [
    "/aurochs_llm_scrub",
    "/.claude-plugin",
    "/commands",
    "/docs",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/runs.db*",
    "/personal",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "dist", ".venv", "venv", "personal"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "N802", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N806", "N803"]
"aurochs_llm_scrub/core/migrations/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["build/", "dist/", "tests/fixtures/", "personal/"]

[[tool.mypy.overrides]]
module = ["psutil.*", "platformdirs.*", "redos_detector.*", "langdetect.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--showlocals", "--tb=short"]
markers = [
    "unit: unit tests, no I/O",
    "integration: integration tests with sqlite",
    "slow: tests that take >1s",
    "windows: windows-specific tests",
    "macos: macos-specific tests",
    "linux: linux-specific tests",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pkg_resources.*"]

[tool.coverage.run]
branch = true
source = ["aurochs_llm_scrub"]
omit = ["*/tests/*", "*/migrations/versions/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
